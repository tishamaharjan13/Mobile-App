<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>

    <style>
      body {
        padding: 20px;
        text-align: center;
        font-weight: bold;
      }

      p {
        display: inline-block;
        padding: 10px 20px;
        margin: 10px;
        font-size: 18px;
        background: #f0f0f0;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
      }

      p:hover {
        background: #e3e3e3;
      }

      button {
        margin-top: 20px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 20px;
      }
      .text {
        font-size: 20px;
      }
      .name {
        font-size: 40px;
      }
    </style>
  </head>

  <body>
    <div class="name">Presidential Graduate School</div>
    <p class="address">Thapagaun, Kathmandu</p>
    <p class="courses">Bsc.IT, BBA, Msc.IT, MBA</p>

    <br />
    <button class="show">Show</button>
    <br />
    <br />
    <div class="text">
      Click me to increase size/ and double click to send back to normal
    </div>
    <div></div>
  </body>
</html>
