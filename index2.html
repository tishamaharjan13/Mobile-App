<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
    <style>
      #box {
        background: #98bf21;
        height: 150px;
        width: 150px;
        position: absolute;
        top: 50px;
        left: 50px;
        line-height: 100px;
        text-align: center;
        color: white;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
      }
      button {
        margin-bottom: 20px;
        padding: 10px 20px;
        font-size: 16px;
      }
      #heading {
        font-size: 40px;
        font-weight: bold;
        text-align: center;
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="heading">Click the box to start animation</div>
    <div id="box">Click Me!</div>
  </body>
</html>
